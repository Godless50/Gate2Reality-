# Gophish — turnkey деплой для АВТОРИЗОВАННЫХ фишинг-симуляций и обучения ИБ.
# Запуск:  cp .env.example .env  →  правки  →  docker compose up -d
#
#   gophish — сам сервис (SQLite). Конфигурируется штатными env-переменными
#             образа (docker/run.sh патчит config.json через jq). Портов на хост
#             НЕ выставляет. Админку по TLS бинарь self-sign'ит сам.
#   caddy   — единственный публикует 80/443, авто-HTTPS (Let's Encrypt).
#
# Схема:
#   Интернет ─443/80─> Caddy ─┬─ admin.DOMAIN ─> gophish:3333 (админка, TLS-passthrough)
#                             └─ phish.DOMAIN ─> gophish:80   (лендинги)

services:
  gophish:
    image: gophish/gophish:0.12.1
    environment:
      # Админ-сервер: слушаем на всех интерфейсах (дефолт образа — 127.0.0.1,
      # тогда Caddy бы не достучался). TLS включён — бинарь сам сгенерит
      # self-signed сертификат; Caddy проксирует к нему с skip-verify.
      ADMIN_LISTEN_URL: "0.0.0.0:3333"
      ADMIN_USE_TLS: "true"
      # CSRF: без домена админки в trusted_origins логин через прокси даёт 403.
      ADMIN_TRUSTED_ORIGINS: ${ADMIN_DOMAIN:?set ADMIN_DOMAIN in .env}
      # Phishing-сервер: обычный HTTP, TLS терминирует Caddy.
      PHISH_LISTEN_URL: "0.0.0.0:80"
      PHISH_USE_TLS: "false"
      # SQLite в persistent volume.
      DB_FILE_PATH: "/data/gophish.db"
      # Необязательный контактный адрес (показывается на служебных страницах).
      CONTACT_ADDRESS: ${CONTACT_ADDRESS:-}
      # Начальный пароль админа (логин admin), ставится при первом создании БД.
      # Пусто → Gophish сгенерит случайный, ищи в `docker compose logs gophish`.
      GOPHISH_INITIAL_ADMIN_PASSWORD: ${GOPHISH_INITIAL_ADMIN_PASSWORD:-}
      TZ: ${TZ:-UTC}
    volumes:
      - gophish_data:/data          # gophish.db (SQLite)
    expose:
      - "3333"                      # админка — только внутри сети, наружу через Caddy
      - "80"                        # phishing-сервер — только внутри сети, наружу через Caddy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - gophish
    environment:
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?set ADMIN_DOMAIN in .env}
      PHISH_DOMAIN: ${PHISH_DOMAIN:?set PHISH_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      TZ: ${TZ:-UTC}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"               # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data            # сертификаты Let's Encrypt
      - caddy_config:/config
    restart: unless-stopped

volumes:
  gophish_data:
  caddy_data:
  caddy_config:
